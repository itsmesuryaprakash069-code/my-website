<!DOCTYPE html>
<html>
<head>
    <title>Surya | My Website</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <nav>
        <h2>Surya</h2>

        <div>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
        </div>
        <button onclick="toggleDarkMode()">🌙 Dark Mode</button>
    </nav>


    <!-- Home -->
    <section id="home" class="hero">

        <h1>Hello, I'm Surya 👋</h1>

        <p>
            I'm learning programming and web development.
        </p>

        <button onclick="sayHello()">Say Hello</button>

    </section>


    <!-- About -->
    <section id="about">

        <h2>About Me</h2>

        <p>
            I already know C and now I'm learning
            HTML, CSS and JavaScript.
        </p>

    </section>


    <!-- Projects -->
    <section id="projects">

        <h2>My Projects</h2>

        <div class="projects">

            <div class="card">
                <h3>Project 1</h3>
                <p>My first web project.</p>
            </div>

            <div class="card">
                <h3>Project 2</h3>
                <p>A project I will build soon.</p>
            </div>

            <div class="card">
                <h3>Project 3</h3>
                <p>Something awesome coming soon.</p>
            </div>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>

</JavaScript>
<script>
function sayHello() {
    alert("Hello Surya! Welcome to my website 🚀");
}

function toggleDarkMode() {
    document.body.classList.toggle("dark");
}
HTML
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f5f5f5;
    color: #222;
}


/* Navigation */

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;

    padding: 20px 10%;

    background-color: #222;
    color: white;
}
</style>
<style>
nav a {
    color: white;
    text-decoration: none;
    margin-left: 25px;
}
.dark {
    background-color: #111;
    color: white;
}

.dark .card {
    background-color: #222;
    color: white;
}
</style>
.dark nav {
    background-color: #000;
}


/* Home */

.hero {
    text-align: center;
    padding: 120px 20px;
}

.hero h1 {
    font-size: 50px;
    margin-bottom: 20px;
}

.hero p {
    font-size: 20px;
    margin-bottom: 30px;
}

button {
    padding: 12px 25px;
    font-size: 18px;

    border: none;
    border-radius: 8px;

    background-color: #222;
    color: white;

    cursor: pointer;
}


/* Sections */

section {
    padding: 80px 10%;
    text-align: center;
}

section h2 {
    font-size: 35px;
    margin-bottom: 25px;
}


/* Projects */

.projects {
    display: flex;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
}

.card {
    background-color: white;

    width: 250px;

    padding: 30px;

    border-radius: 10px;

    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.card h3 {
    margin-bottom: 15px;

}
